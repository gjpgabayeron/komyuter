name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Hermetic subset: apps/admin's suite runs in the node environment with no
      # database. apps/server's integration half needs a live Supabase stack, so it
      # stays a local pre-merge obligation rather than a CI step.
      - name: Test (admin)
        run: pnpm --filter admin test

      - name: Build
        run: pnpm build
